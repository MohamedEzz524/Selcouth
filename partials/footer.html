<!-- ============================================================
     SITE FOOTER — single source, injected near the end of the page by
     server.js on any page that doesn't already have its own footer.
     Namespaced .site-foot / .sf-* · white + panel palette only.
     ============================================================ -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

  .site-foot {
    background: #050505;
    color: #d9d5df;
    border-top: 1px solid #17151d; /* shared panel colour */
    font-family: "Inter", "DM Sans", "Helvetica Neue", Arial, sans-serif;
    padding: clamp(3rem, 6vw, 5rem) clamp(1.25rem, 5vw, 4rem) 2rem;
  }
  .sf-inner {
    max-width: 1440px;
    margin: 0 auto;
  }

  /* row 1 — logo left */
  .sf-top {
    margin-bottom: clamp(2.2rem, 5vw, 3.6rem);
  }
  .sf-logo {
    display: inline-block;
    line-height: 0;
  }
  .sf-logo img {
    width: 54px;
    height: auto;
    display: block;
  }

  /* row 2 — 4 columns */
  .sf-cols {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(1.5rem, 3vw, 2.5rem);
  }
  .sf-col {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .sf-col__label {
    margin: 0 0 0.5rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #ffffff;
  }
  .sf-col a {
    font-size: 0.92rem;
    color: rgba(217, 213, 223, 0.68);
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .sf-col a:hover {
    color: #ffffff;
  }

  /* social column: a horizontal row of icons rather than stacked text links */
  .sf-social {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 1.1rem;
    margin-top: 0.15rem;
  }
  .sf-social a {
    display: inline-flex;
    color: rgba(217, 213, 223, 0.68);
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .sf-social a:hover {
    color: #ffffff;
    transform: translateY(-2px);
  }
  .sf-social svg {
    width: 22px;
    height: 22px;
    display: block;
    fill: currentColor;
  }

  /* row 3 — centred copyright */
  .sf-copy {
    margin-top: clamp(2.5rem, 5vw, 4rem);
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
  }
  .sf-copy p {
    margin: 0;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(217, 213, 223, 0.5);
  }

  /* mobile — links become 2 columns */
  @media (max-width: 760px) {
    .sf-cols {
      grid-template-columns: repeat(2, 1fr);
      row-gap: 2.2rem;
    }
  }
</style>
