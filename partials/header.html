<!-- ============================================================
     SITE HEADER — single source, injected on every page by server.js.
     Namespaced .site-header / .sh-* so it never collides with any page's
     own styles. Keeps the brand-logo id so the home preloader morph still
     has its target. Edit here once; it updates everywhere.
     ============================================================ -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
  @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap");

  .site-header {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 22px clamp(20px, 4vw, 56px);
    pointer-events: none;
    font-family: "Inter", "DM Sans", "Helvetica Neue", Arial, sans-serif;
  }
  .site-header > * {
    pointer-events: auto;
  }

  /* ---- left: desktop links + mobile burger ---- */
  .sh-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sh-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sh-link {
    padding: 10px 16px;
    border: none;
    border-radius: 999px;
    background: none;
    color: #fff;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing:  0;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .sh-link:hover,
  .sh-link[aria-current="page"] {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
  }

  /* ---- centre logo ---- */
  .sh-logo {
    display: block;
    justify-self: center;
    line-height: 0;
  }
  .sh-logo img {
    width: 46px;
    height: auto;
    display: block;
  }

  /* ---- right: glassy circular icon buttons ---- */
  .sh-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
  }
  .sh-icon {
    width: 46px;
    height: 46px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.16),
      rgba(255, 255, 255, 0.05) 60%
    );
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 8px 24px rgba(0, 0, 0, 0.25);
    transition:
      background 0.35s ease,
      box-shadow 0.35s ease;
  }
  .sh-icon:hover {
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.28),
      rgba(255, 255, 255, 0.09) 60%
    );
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .sh-icon svg {
    width: 20px;
    height: 20px;
  }

  /* ---- language toggle ---- */
  .sh-lang {
    height: 46px;
    min-width: 46px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing:  0;
    text-transform: uppercase;
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.16),
      rgba(255, 255, 255, 0.05) 60%
    );
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 8px 24px rgba(0, 0, 0, 0.25);
    transition:
      background 0.35s ease,
      box-shadow 0.35s ease;
  }
  .sh-lang:hover {
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.28),
      rgba(255, 255, 255, 0.09) 60%
    );
  }
  /* Arabic sits better a touch larger and without the wide tracking */
  html[lang="ar"] .sh-lang {
    font-size: 13px;
    letter-spacing: 0;
  }

  /* ---- burger (mobile only) — same glass treatment as .sh-icon ---- */
  .sh-burger {
    display: none;
    width: 46px;
    height: 46px;
    padding: 0;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.16),
      rgba(255, 255, 255, 0.05) 60%
    );
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 8px 24px rgba(0, 0, 0, 0.25);
    transition:
      background 0.35s ease,
      box-shadow 0.35s ease;
  }
  .sh-burger:hover,
  .sh-burger[aria-expanded="true"] {
    background: radial-gradient(
      120% 120% at 30% 20%,
      rgba(255, 255, 255, 0.28),
      rgba(255, 255, 255, 0.09) 60%
    );
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .sh-burger svg {
    width: 22px;
    height: 22px;
  }

  /* ---- mobile dropdown ---- */
  .sh-mobile {
    position: fixed;
    top: 72px;
    left: 16px;
    z-index: 8999;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 172px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(22, 18, 32, 0.6);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition:
      opacity 0.3s ease,
      transform 0.3s ease,
      visibility 0.3s;
  }
  .sh-mobile.open {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  .sh-mobile a {
    padding: 10px;
    border-radius: 8px;
    color: rgba(255, 255, 255, 0.78);
    font-size: 12px;
    font-weight: 700;
    letter-spacing:  0;
    text-transform: uppercase;
    text-decoration: none;
  }
  .sh-mobile a:hover,
  .sh-mobile a[aria-current="page"] {
    color: #fff;
    background: rgba(255, 255, 255, 0.07);
  }

  @media (max-width: 767px) {
    .site-header {
      padding: 14px 16px;
    }
    .sh-nav {
      display: none;
    }
    .sh-burger {
      display: inline-flex;
    }
    .sh-right .sh-label {
      display: none;
    }
    /* the toggle is relocated next to the burger — trim it to icon scale */
    .sh-lang {
      height: 40px;
      min-width: 40px;
      padding: 0 12px;
      font-size: 10px;
    }
    html[lang="ar"] .sh-lang {
      font-size: 12px;
    }
  }
</style>

    </nav>
    <div class="sh-mobile" id="sh-mobile">
      <a href="/collection?view=perfumes" data-ar="العطور">Perfumes</a>

      <a href="/about-us" data-ar="قصتنا">Our Story</a>

  <a class="sh-logo" id="brand-logo" href="/" aria-label="Selcouth home">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.4" />
        <path d="M5.5 19.2c1.2-3 3.6-4.6 6.5-4.6s5.3 1.6 6.5 4.6" />

</header>

<script>
  (function () {
    var header = document.currentScript
      ? document.currentScript.previousElementSibling
      : null;
    // Fall back to querying if currentScript chain isn't the header.
    var burger = document.querySelector(".site-header .sh-burger");
    var mobile = document.getElementById("sh-mobile");

    if (burger && mobile) {
      burger.addEventListener("click", function () {
        var open = mobile.classList.toggle("open");
        burger.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!mobile.classList.contains("open")) return;
        if (!mobile.contains(e.target) && !burger.contains(e.target)) {
          mobile.classList.remove("open");
          burger.setAttribute("aria-expanded", "false");
        }
      });
    }

    // The language toggle lives with the account/cart icons on desktop, but
    // on mobile it sits beside the burger on the left. CSS can't reparent, so
    // the button is moved between the two clusters at the breakpoint.
    (function () {
      var lang = document.getElementById("sh-lang");
      var left = document.querySelector(".site-header .sh-left");
      var right = document.querySelector(".site-header .sh-right");
      if (!lang || !left || !right) return;
      var mq = window.matchMedia("(max-width: 767px)");

      function place() {
        if (mq.matches) {
          // after the burger, before the nav
          if (lang.parentNode !== left) left.insertBefore(lang, left.children[1] || null);
        } else if (lang.parentNode !== right) {
          right.insertBefore(lang, right.firstChild);
        }
      }
      place();
      if (mq.addEventListener) mq.addEventListener("change", place);
      else if (mq.addListener) mq.addListener(place);
    })();

    // Active-link highlighting based on the current path. Links may carry a
    // ?view= (the collection page's Perfumes / Samples tabs), so compare the
    // path first and only then disambiguate on that parameter.
    var path = location.pathname.replace(/\/+$/, "") || "/";
    var view = new URLSearchParams(location.search).get("view") || "";
    document
      .querySelectorAll(".site-header .sh-link, .site-header .sh-mobile a")
      .forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href || href === "#") return;
        var url = new URL(href, location.origin);
        var norm = url.pathname.replace(/\/+$/, "") || "/";
        if (norm !== path) return;
        var linkView = url.searchParams.get("view") || "";
        if (linkView && linkView !== view) return;
        a.setAttribute("aria-current", "page");
      });
  })();
</script>

<script>
  /* ============================================================
     LANGUAGE — English / Saudi Arabic, site-wide.

     Any element carrying data-ar has its markup swapped for that
     Arabic copy; the English original is captured into data-en on the
     first switch so it can be restored. data-ar-label does the same
     for aria-label. Page scripts that generate text at runtime (the
     carousels, the collection filter) listen for the `sel:lang` event
     and read window.SelLang.
     ============================================================ */
  (function () {
    var KEY = "sel-lang";
    var btn = document.getElementById("sh-lang");

    function apply(lang, persist) {
      var ar = lang === "ar";
      var root = document.documentElement;
      root.lang = ar ? "ar" : "en";
      root.dir = ar ? "rtl" : "ltr";

      document.querySelectorAll("[data-ar]").forEach(function (el) {
        if (el.dataset.en === undefined) el.dataset.en = el.innerHTML;
        el.innerHTML = ar ? el.dataset.ar : el.dataset.en;
      });
      document.querySelectorAll("[data-ar-label]").forEach(function (el) {
        if (el.dataset.enLabel === undefined)
          el.dataset.enLabel = el.getAttribute("aria-label") || "";
        el.setAttribute(
          "aria-label",
          ar ? el.dataset.arLabel : el.dataset.enLabel,
        );
      });

      // the toggle always offers the OTHER language
      if (btn) btn.textContent = ar ? "EN" : "عربي";
      window.SelLang = lang;
      if (persist) {
        try {
          localStorage.setItem(KEY, lang);
        } catch (_) {}
      }
      document.dispatchEvent(
        new CustomEvent("sel:lang", { detail: { lang: lang } }),
      );
    }

    var saved = "en";
    try {
      saved = localStorage.getItem(KEY) || "en";
    } catch (_) {}
    window.SelLang = saved;
    window.SelApplyLang = apply;

    if (btn)
      btn.addEventListener("click", function () {
        apply(window.SelLang === "ar" ? "en" : "ar", true);
      });

    // run once the page's own markup exists, then again on full load in
    // case a page injects more translatable copy late
    function boot() {
      apply(saved, false);
    }
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", boot);
    else boot();
  })();
</script>

<style>
  /* Arabic: a face with proper Arabic coverage, and a little more line
     height for the taller glyphs. */
  html[lang="ar"] body {
    font-family: "Cairo", "Segoe UI", "Tahoma", sans-serif;
    /* Arabic glyphs are taller and carry diacritics — the Latin leading
       makes lines collide */
    line-height: 1.95;
  }
  html[lang="ar"] p,
  html[lang="ar"] li,
  html[lang="ar"] [data-ar] {
    line-height: 1.95;
  }
  html[lang="ar"] h1,
  html[lang="ar"] h2,
  html[lang="ar"] h3,
  html[lang="ar"] h4 {
    line-height: 1.5;
  }
  /* The display/mono faces (MB PH One, forma-djr-mono) have no Arabic
     coverage, and pages set font-family per-element — so force Cairo onto
     translated copy and onto the blocks the carousels write at runtime. */
  html[lang="ar"] [data-ar],
  html[lang="ar"] h1,
  html[lang="ar"] h2,
  html[lang="ar"] h3,
  html[lang="ar"] h4,
  html[lang="ar"] button,
  html[lang="ar"] .pf-info,
  html[lang="ar"] .pf-info *,
  html[lang="ar"] .col-title,
  html[lang="ar"] .col-eyebrow {
    font-family: "Cairo", "Segoe UI", "Tahoma", sans-serif !important;
  }
  html[lang="ar"] .sh-link,
  html[lang="ar"] .sh-mobile a {
    letter-spacing: 0;
    font-size: 12px;
  }
  /* the wide Latin tracking looks broken on Arabic text */
  html[lang="ar"] [data-ar] {
    letter-spacing: 0 !important;
  }
  /* The navbar keeps its Latin left-to-right arrangement in Arabic — burger
     and links left, logo centred, language/account/cart right — so the header
     never reshuffles when the language changes. Arabic text inside still
     shapes right-to-left on its own. */
  html[dir="rtl"] .site-header,
  html[dir="rtl"] .sh-mobile {
    direction: ltr;
  }
</style>
